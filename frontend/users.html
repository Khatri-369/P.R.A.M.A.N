<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User management · P.R.A.M.A.N</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/command-center.css" />
  </head>
  <body>
    <div id="shell"></div>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-heading">
          <div>
            <div class="eyebrow">PRAMĀN / EVIDENCE INTELLIGENCE</div>
            <h1 id="title">User management</h1>
            <p class="muted" id="subtitle">
              Manage access for your investigation team.
            </p>
          </div>
          <div id="heading-action"></div>
        </div>
        <div id="message" role="alert"></div>
        <section class="card">
          <div class="card-head">
            <h2>Team directory</h2>
            <span class="badge blue">Admin access</span>
          </div>
          <div id="records"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Create a user</h2></div>
          <form id="user-form" class="card-body">
            <div class="form-grid">
              <label
                >Full name<input
                  name="name"
                  required
                  maxlength="100"
                  autocomplete="name" /></label
              ><label
                >Email address<input
                  name="email"
                  type="email"
                  required
                  maxlength="254"
                  autocomplete="email" /></label
              ><label
                >Initial password<input
                  name="password"
                  type="password"
                  required
                  minlength="8"
                  maxlength="72"
                  autocomplete="new-password"
                /><small
                  >8–72 bytes. Share securely with the user.</small
                ></label
              ><label
                >Role<select name="role">
                  <option value="investigator">Investigator</option>
                  <option value="forensic">Forensic Officer</option>
                  <option value="admin">Admin</option>
                </select></label
              >
            </div>
            <div class="form-footer"><button>＋ Create user</button></div>
          </form>
        </section>
        <footer class="footer">
          PRAMĀN · Digital evidence & chain of custody · Educational prototype
        </footer>
      </main>
    </div>
    <script type="module" src="/js/users.js"></script>
  </body>
</html>
